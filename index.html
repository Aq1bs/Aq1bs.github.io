<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heavenly Digital Countdown</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: url("hello.png") center/cover no-repeat fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: 'Segoe UI', sans-serif;
    }
/* Floating gold mist */
.mist {
    position: absolute;
    width: 5px;
    height: 5px;
    background: rgba(255,215,0,0.75);
    border-radius: 50%;
    opacity: 0.8;
    animation: mistFloat 10s linear infinite;
    pointer-events: none;
}

@keyframes mistFloat {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    100% { transform: translateY(-120vh) scale(0.4); opacity: 0; }
}
/* Floating geometric shapes */
.shape {
    position: absolute;
    font-size: 1.8rem;
    color: rgba(255,215,0,0.85);
    opacity: 0.9;
    animation: shapeFloat 9s linear infinite;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(255,215,0,0.9);
}

@keyframes shapeFloat {
    0% { transform: translateY(0) scale(1); opacity: 0.9; }
    100% { transform: translateY(-120vh) scale(0.6); opacity: 0; }
}


/* Black rounded box */
.clock-box {
    background: rgba(0,0,0,0.75);
    padding: 26px 40px; /* slightly larger again */
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    z-index: 10;
    transform: translateX(-40px); /* keep your left shift */
}

/* Digital numbers */
.digits {
    font-size: 4.2rem; /* bigger again */
    letter-spacing: 4px;
    color: #FFD700;
    text-shadow: 0 0 22px rgba(255,215,0,0.9);
    font-weight: 700;
}

/* Bold gold labels */
.labels {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    width: 100%;
    color: #FFD700;
    font-weight: 800;
    font-size: 1rem; /* bold + readable */
    text-shadow: 0 0 10px rgba(255,215,0,0.8);
}

.labels span {
    flex: 1;
    text-align: center;
}
}

    .labels span {
        flex: 1;
        text-align: center;
    }

    /* Heavenly lightning effects */
    .beam, .arc, .halo, .symbol, .flash {
        position: absolute;
        pointer-events: none;
    }

    .beam {
        width: 2px;
        height: 200vh;
        background: linear-gradient(to bottom, rgba(255,215,0,0.4), rgba(255,215,0,0));
        animation: beamFall 4s linear infinite;
        opacity: 0.5;
    }

    @keyframes beamFall {
        0% { transform: translateY(-100vh); }
        100% { transform: translateY(100vh); }
    }

    .arc {
        width: 120px;
        height: 2px;
        background: rgba(255,215,0,0.6);
        animation: arcFlash 2s ease-in-out infinite;
        opacity: 0.6;
    }

    @keyframes arcFlash {
        0% { opacity: 0; transform: scaleX(0.2) rotate(0deg); }
        10% { opacity: 1; transform: scaleX(1) rotate(10deg); }
        40% { opacity: 0.4; }
        100% { opacity: 0; transform: scaleX(0.2) rotate(-10deg); }
    }

    .halo {
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,215,0,0.3), transparent 70%);
        animation: haloPulse 5s ease-in-out infinite;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

    @keyframes haloPulse {
        0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
        100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
    }

    .symbol {
        font-size: 2rem;
        color: rgba(255,215,0,0.8);
        animation: symbolFlash 6s ease-in-out infinite;
    }

    @keyframes symbolFlash {
        0% { opacity: 0; transform: scale(0.8); }
        10% { opacity: 1; transform: scale(1); }
        30% { opacity: 0; }
        100% { opacity: 0; }
    }

    .flash {
        inset: 0;
        background: radial-gradient(circle, rgba(255,215,0,0.2), rgba(0,0,0,0.8));
        animation: flashPulse 7s ease-in-out infinite;
        opacity: 0;
    }

    @keyframes flashPulse {
        0% { opacity: 0; }
        8% { opacity: 0.3; }
        20% { opacity: 0; }
        100% { opacity: 0; }
    }
</style>
</head>

<body>

<div class="halo"></div>
<div class="flash"></div>

<div class="clock-box">
    <div class="digits" id="digits">00 : 00 : 00 : 00</div>

    <div class="labels">
        <span>DAYS</span>
        <span>HOURS</span>
        <span>MIN</span>
        <span>SEC</span>
    </div>
</div>

<script>
function updateCountdown() {
    const target = new Date("2026-03-24T00:00:00").getTime();
    const now = Date.now();
    let diff = Math.max(0, target - now);

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById("digits").innerText =
        `${String(d).padStart(2,'0')} : ${String(h).padStart(2,'0')} : ${String(m).padStart(2,'0')} : ${String(s).padStart(2,'0')}`;
}


/* Gold mist particles */
setInterval(() => {
    const m = document.createElement("div");
    m.className = "mist";
    m.style.left = Math.random() * 100 + "vw";
    m.style.bottom = "-10px";
    m.style.animationDuration = 6 + Math.random() * 5 + "s";
    document.body.appendChild(m);

    setTimeout(() => m.remove(), 12000);
}, 350);

setInterval(updateCountdown, 1000);
updateCountdown();

/* Lightning elements */
for (let i = 0; i < 10; i++) {
    const b = document.createElement("div");
    b.className = "beam";
    b.style.left = Math.random() * 100 + "vw";
    b.style.animationDuration = 3 + Math.random() * 3 + "s";
    document.body.appendChild(b);
}

for (let i = 0; i < 5; i++) {
    const a = document.createElement("div");
    a.className = "arc";
    a.style.top = Math.random() * 100 + "vh";
    a.style.left = Math.random() * 100 + "vw";
    a.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(a);
}

const words = ["الله", "محمد ﷺ", "مكة", "المدينة"];
for (let i = 0; i < 4; i++) {
    const s = document.createElement("div");
    s.className = "symbol";
    s.innerText = words[i];
    s.style.top = Math.random() * 80 + "vh";
    s.style.left = Math.random() * 80 + "vw";
    s.style.animationDelay = i * 1.5 + "s";
    document.body.appendChild(s);
}

/* Floating geometric shapes */
const shapes = ["✦", "✸", "✺", "✶", "✷"];

setInterval(() => {
    const sh = document.createElement("div");
    sh.className = "shape";
    sh.innerText = shapes[Math.floor(Math.random() * shapes.length)];
    sh.style.left = Math.random() * 100 + "vw";
    sh.style.bottom = "-20px";
    sh.style.animationDuration = 6 + Math.random() * 5 + "s";
    document.body.appendChild(sh);

    setTimeout(() => sh.remove(), 12000);
}, 450);
</script>

</body>
</html>
