<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center; /* center horizontally */
      align-items: center;     /* center vertically */
      background: url('hello.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
    }

   .countdown {
  background: rgba(0, 0, 0, 0.85);
  padding: 50px;
  border-radius: 20px;
  color: #FFD700; /* gold */
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  transform: translateX(-20px); /* just a subtle nudge left */
}

    .time {
      display: flex;
      gap: 30px; /* more spacing between units */
    }

    .flip-unit {
      position: relative;
      width: 130px;   /* bigger width */
      height: 160px;  /* bigger height */
      perspective: 1000px;
    }

    .flip-card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #000;
      color: #FFD700;
      font-size: 3.5rem; /* larger font */
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: inset 0 -5px 0 #FFD700;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
    }

    .label {
      text-align: center;
      margin-top: 170px; /* adjusted for taller cards */
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="countdown">
    <div class="time">
      <div class="flip-unit">
        <div id="days" class="flip-card">00</div>
        <div class="label">Days</div>
      </div>
      <div class="flip-unit">
        <div id="hours" class="flip-card">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="flip-unit">
        <div id="minutes" class="flip-card">00</div>
        <div class="label">Minutes</div>
      </div>
    </div>
  </div>

  <script>
const targetDate = new Date("2026-03-24T00:00:00").getTime();

    let lastDays, lastHours, lastMinutes;

    function flip(id, newVal) {
      const card = document.getElementById(id);
      card.style.transform = "rotateX(-90deg)";
      setTimeout(() => {
        card.innerText = newVal;
        card.style.transform = "rotateX(0deg)";
      }, 200);
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector(".time").innerHTML = "<h2>Event Started</h2>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

      if (days !== lastDays) {
        flip("days", days);
        lastDays = days;
      }
      if (hours !== lastHours) {
        flip("hours", hours);
        lastHours = hours;
      }
      if (minutes !== lastMinutes) {
        flip("minutes", minutes);
        lastMinutes = minutes;
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
