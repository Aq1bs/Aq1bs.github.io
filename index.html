<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heavenly Lightning Countdown</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: url("hello.png") center/cover no-repeat fixed;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        position: relative;
    }

    /* Soft descending beams */
    .beam {
        position: absolute;
        top: -100vh;
        width: 2px;
        height: 200vh;
        background: linear-gradient(to bottom, rgba(255,215,0,0.4), rgba(255,215,0,0));
        opacity: 0.6;
        animation: beamFall 4s linear infinite;
    }

    @keyframes beamFall {
        0% { transform: translateY(-100vh); }
        100% { transform: translateY(100vh); }
    }

    /* Lightning arcs */
    .arc {
        position: absolute;
        width: 150px;
        height: 3px;
        background: rgba(255,215,0,0.7);
        opacity: 0.7;
        transform-origin: left center;
        animation: arcFlash 1.8s ease-out infinite;
    }

    @keyframes arcFlash {
        0% { opacity: 0; transform: scaleX(0.2) rotate(0deg); }
        10% { opacity: 1; transform: scaleX(1) rotate(10deg); }
        40% { opacity: 0.4; }
        100% { opacity: 0; transform: scaleX(0.2) rotate(-10deg); }
    }

    /* Halo pulse */
    .halo {
        position: absolute;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,215,0,0.4), transparent 70%);
        animation: haloPulse 5s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes haloPulse {
        0% { transform: scale(0.8); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 0.7; }
        100% { transform: scale(0.8); opacity: 0.4; }
    }

    /* Sacred symbol flickers */
    .symbol {
        position: absolute;
        font-size: 3rem;
        color: rgba(255,215,0,0.85);
        opacity: 0;
        animation: symbolFlash 6s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes symbolFlash {
        0% { opacity: 0; transform: scale(0.8); }
        10% { opacity: 1; transform: scale(1); }
        30% { opacity: 0; }
        100% { opacity: 0; }
    }

    /* Soft flash moments */
    .flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(255,215,0,0.25), rgba(0,0,0,0.9));
        opacity: 0;
        animation: flashPulse 7s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes flashPulse {
        0% { opacity: 0; }
        8% { opacity: 0.4; }
        20% { opacity: 0; }
        100% { opacity: 0; }
    }

    /* Floating gold mist */
    .mist {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(255,215,0,0.7);
        border-radius: 50%;
        opacity: 0.7;
        animation: mistFloat 10s linear infinite;
    }

    @keyframes mistFloat {
        0% { transform: translateY(0) scale(1); opacity: 0.7; }
        100% { transform: translateY(-120vh) scale(0.4); opacity: 0; }
    }

    /* BIGGER countdown */
    .countdown {
        position: relative;
        z-index: 10;
        color: #FFD700;
        font-size: 6rem; /* BIGGER TIMER */
        font-weight: bold;
        text-shadow: 0 0 25px rgba(255,215,0,0.9);
    }
</style>
</head>
<body>

<div class="halo"></div>
<div class="flash"></div>

<div class="countdown" id="countdown">Loading...</div>

<script>
/* Create beams */
for (let i = 0; i < 12; i++) {
    const b = document.createElement("div");
    b.className = "beam";
    b.style.left = Math.random() * 100 + "vw";
    b.style.animationDuration = 3 + Math.random() * 3 + "s";
    document.body.appendChild(b);
}

/* Create arcs */
for (let i = 0; i < 6; i++) {
    const a = document.createElement("div");
    a.className = "arc";
    a.style.top = Math.random() * 100 + "vh";
    a.style.left = Math.random() * 100 + "vw";
    a.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(a);
}

/* Sacred symbols */
const words = ["الله", "محمد ﷺ", "مكة", "المدينة"];
for (let i = 0; i < 4; i++) {
    const s = document.createElement("div");
    s.className = "symbol";
    s.innerText = words[i];
    s.style.top = Math.random() * 80 + "vh";
    s.style.left = Math.random() * 80 + "vw";
    s.style.animationDelay = i * 1.5 + "s";
    document.body.appendChild(s);
}

/* Mist */
setInterval(() => {
    const m = document.createElement("div");
    m.className = "mist";
    m.style.left = Math.random() * 100 + "vw";
    m.style.bottom = "-10px";
    m.style.animationDuration = 6 + Math.random() * 4 + "s";
    document.body.appendChild(m);
    setTimeout(() => m.remove(), 12000);
}, 300);

/* Countdown */
const target = new Date("2026-03-24T00:00:00").getTime();
setInterval(() => {
    const now = Date.now();
    const diff = target - now;
    if (diff < 0) {
        countdown.innerText = "Time Reached";
        return;
    }
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    countdown.innerText = `${d}d ${h}h ${m}m`;
}, 1000);
</script>

</body>
</html>
